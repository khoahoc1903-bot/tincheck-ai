<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b63b6">
  <title>TinCheck AI</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="app-shell" id="app">
  <header class="brand-card">
    <div class="brand-icon" aria-hidden="true">🛡️</div>
    <div>
      <div class="brand-name">TinCheck AI</div>
      <div class="slogan-line">Kiểm tra trước khi tin</div>
      <div class="slogan-line">Xác minh trước khi chia sẻ</div>
    </div>
  </header>

  <section id="homeScreen" class="screen">
    <h1>Bạn muốn kiểm tra bằng cách nào?</h1>

    <div id="inputActions" class="input-actions">
      <button class="input-card" id="voiceBtn" type="button">
        <span class="input-icon">🎤</span>
        <span class="input-copy"><strong>Nói để kiểm tra</strong><small>Kể lại điều đang xảy ra</small></span>
      </button>
      <button class="input-card" id="cameraBtn" type="button">
        <span class="input-icon">📷</span>
        <span class="input-copy"><strong>Chụp ảnh ngay</strong><small>Chụp tin nhắn, thông báo...</small></span>
      </button>
      <button class="input-card" id="galleryBtn" type="button">
        <span class="input-icon">🖼️</span>
        <span class="input-copy"><strong>Chọn ảnh có sẵn</strong><small>Lấy ảnh từ điện thoại</small></span>
      </button>
      <button class="input-card" id="textBtn" type="button">
        <span class="input-icon">✍️</span>
        <span class="input-copy"><strong>Dán nội dung hoặc link</strong><small>Tin nhắn, bài đăng, đường link...</small></span>
      </button>
    </div>

    <input id="cameraInput" class="visually-hidden" type="file" accept="image/*" capture="environment">
    <input id="galleryInput" class="visually-hidden" type="file" accept="image/*">

    <section id="voicePanel" class="work-panel hidden" aria-live="polite">
      <button class="change-mode-btn" data-change-mode type="button">← CHỌN CÁCH KHÁC</button>
      <div class="panel-title">Nói để TinCheck nghe</div>
      <div id="voiceStatus" class="voice-status">Bấm micro và nói chậm, rõ.</div>
      <textarea id="voiceTranscript" class="transcript" rows="5" placeholder="Lời bạn nói sẽ hiện ở đây..."></textarea>
      <div class="button-stack">
        <button class="primary-btn" id="confirmVoiceBtn" type="button">🔎 KIỂM TRA</button>
        <button class="outline-btn" id="speakAgainBtn" type="button">🎤 NÓI LẠI</button>
      </div>
    </section>

    <section id="imagePanel" class="work-panel hidden">
      <button class="change-mode-btn" data-change-mode type="button">← CHỌN CÁCH KHÁC</button>
      <div class="panel-title">Ảnh cần kiểm tra</div>
      <img id="imagePreview" class="image-preview" alt="Ảnh được chọn để kiểm tra">
      <div class="button-stack">
        <button class="primary-btn" id="checkImageBtn" type="button">🔎 KIỂM TRA ẢNH</button>
        <button class="outline-btn" id="chooseAgainBtn" type="button">↻ CHỌN / CHỤP LẠI</button>
      </div>
    </section>

    <section id="textPanel" class="work-panel hidden">
      <button class="change-mode-btn" data-change-mode type="button">← CHỌN CÁCH KHÁC</button>
      <label class="panel-title" for="textInput">Nội dung cần kiểm tra</label>
      <textarea id="textInput" rows="7" placeholder="Dán nội dung hoặc đường link vào đây..."></textarea>
      <button class="primary-btn" id="checkTextBtn" type="button">🔎 KIỂM TRA</button>
    </section>

    <div id="homeError" class="error-box hidden" role="alert"></div>
  </section>

  <section id="loadingScreen" class="screen hidden" aria-live="polite">
    <div class="loading-card">
      <div class="loader" aria-hidden="true"></div>
      <h2 id="loadingTitle">TinCheck đang kiểm tra...</h2>
      <p id="loadingNote">Đang đọc nội dung và đối chiếu nguồn khi cần.</p>
    </div>
  </section>

  <section id="resultScreen" class="screen hidden" aria-live="polite">
    <div class="result-top-row">
      <div id="riskCard" class="risk-card risk-review">
        <div class="risk-icon" id="riskIcon">🟠</div>
        <div class="risk-copy">
          <div class="risk-level" id="riskLevel">CẦN KIỂM TRA THÊM</div>
          <div class="risk-headline" id="riskHeadline"></div>
        </div>
      </div>
      <button id="listenBtn" class="listen-btn" type="button">🔊<span id="listenLabel">NGHE<br>KẾT QUẢ</span></button>
    </div>

    <section class="do-now-card">
      <h2>Bạn nên làm ngay</h2>
      <div id="actionList" class="action-list"></div>
    </section>

    <button id="shareBtn" class="share-btn hidden" type="button">💬 MỞ ZALO GỬI NGƯỜI THÂN</button>

    <button class="accordion-btn" id="whyBtn" type="button"><span>🔎 Vì sao TinCheck đánh giá như vậy?</span><span>⌄</span></button>
    <section class="accordion-panel hidden" id="whyPanel"></section>

    <button class="accordion-btn" id="sourceBtn" type="button"><span>🌐 TinCheck đã đối chiếu gì?</span><span>⌄</span></button>
    <section class="accordion-panel hidden" id="sourcePanel"></section>

    <button class="accordion-btn" id="detailBtn" type="button"><span>🧠 Xem phân tích chi tiết</span><span>⌄</span></button>
    <section class="accordion-panel hidden" id="detailPanel"></section>

    <div id="resultError" class="error-box hidden" role="alert"></div>
    <button id="newCheckBtn" class="outline-btn full-btn" type="button">← KIỂM TRA NỘI DUNG KHÁC</button>
  </section>
</main>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
